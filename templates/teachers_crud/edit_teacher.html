{% extends 'base.html' %}

{% block title %}
Edit Teacher
{% endblock %}

{% block content %}

<h2>Edit Teacher</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="full_name"
        value="{{ teacher.full_name }}"
        class="form-control mb-3"
        required>

    <input
        type="email"
        name="email"
        value="{{ teacher.email }}"
        class="form-control mb-3"
        required>

    <input
        type="text"
        name="phone_number"
        value="{{ teacher.phone_number }}"
        class="form-control mb-3"
        required>

    <input
        type="text"
        name="subject"
        value="{{ teacher.subject }}"
        class="form-control mb-3"
        required>

    <button type="submit" class="btn btn-success">
        Update Teacher
    </button>

    <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
