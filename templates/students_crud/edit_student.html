{% extends 'base.html' %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<h2>Edit Student</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        value="{{ student.name }}"
        class="form-control mb-3"
        required>

    <input
        type="email"
        name="email"
        value="{{ student.email }}"
        class="form-control mb-3"
        required>

    <input
        type="text"
        name="phone"
        value="{{ student.phone }}"
        class="form-control mb-3"
        required>

    <input
        type="text"
        name="course"
        value="{{ student.course }}"
        class="form-control mb-3"
        required>

    <button type="submit" class="btn btn-success">
        Update Student
    </button>

    <a href="{% url 'student_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
