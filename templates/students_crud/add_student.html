{% extends 'base.html' %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        class="form-control mb-3"
        placeholder="Student Name"
        required>

    <input
        type="email"
        name="email"
        class="form-control mb-3"
        placeholder="Email Address"
        required>

    <input
        type="text"
        name="phone"
        class="form-control mb-3"
        placeholder="Phone Number"
        required>

    <input
        type="text"
        name="course"
        class="form-control mb-3"
        placeholder="Course"
        required>

    <button type="submit" class="btn btn-success">
        Save Student
    </button>

    <a href="{% url 'student_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
