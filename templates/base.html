<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}School Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            School Management System
        </a>

        <div>

            <a href="{% url 'home' %}" class="btn btn-outline-light me-2">
                Home
            </a>

            <a href="{% url 'student_list' %}" class="btn btn-outline-light me-2">
                Students
            </a>

            <a href="{% url 'teacher_list' %}" class="btn btn-outline-light me-2">
                Teachers
            </a>

            <a href="{% url 'add_student' %}" class="btn btn-primary me-2">
                Add Student
            </a>

            <a href="{% url 'add_teacher' %}" class="btn btn-success">
                Add Teacher
            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

{% block content %}
{% endblock %}

</div>

</body>
</html>
